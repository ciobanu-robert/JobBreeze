<app-page-shell>
  <main class="auth-main">
    <app-auth-card>
      <h1 class="auth-title">
        {{ language.t('auth.reset.title') }}
      </h1>
      <p class="auth-subtitle">
        {{ language.t('auth.reset.subtitle') }}
      </p>

      <form class="auth-form">
        <div class="auth-field">
          <label for="reset-password">
            {{ language.t('auth.newPasswordLabel') }}
          </label>
          <app-password-field
            fieldId="reset-password"
            autocomplete="new-password"
          ></app-password-field>
        </div>
        <button class="auth-submit" type="button">
          {{ language.t('auth.updatePassword') }}
        </button>
        <p class="auth-switch">
          <a class="auth-link" routerLink="/login">
            {{ language.t('auth.backToSignIn') }}</a
          >
        </p>
      </form>
    </app-auth-card>
  </main>
</app-page-shell>
