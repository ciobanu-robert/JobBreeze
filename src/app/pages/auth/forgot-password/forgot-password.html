<app-page-shell>
    <main class="auth-main">
        <app-auth-card>
            <h1 class="auth-title">Reset your password</h1>
            <p class="auth-subtitle">We'll email you a reset link.</p>

            <form class="auth-form">
                <div class="auth-field">
                    <label for="forgot-email">Email</label>
                    <input id="forgot-email" type="email" autocomplete="email">
                </div>
                <button class="auth-submit" type="button">Send reset link</button>
                <p class="auth-switch">Remember your password? <a class="auth-link" routerLink="/login">Sign in</a></p>
            </form>
        </app-auth-card>
    </main>
</app-page-shell>
