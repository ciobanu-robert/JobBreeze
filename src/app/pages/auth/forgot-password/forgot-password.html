<app-page-shell>
  <main class="auth-main">
    <app-auth-card>
      <h1 class="auth-title">
        {{ language.t('auth.forgot.title') }}
      </h1>
      <p class="auth-subtitle">
        {{ language.t('auth.forgot.subtitle') }}
      </p>

      <form class="auth-form">
        <div class="auth-field">
          <label for="forgot-email">
            {{ language.t('auth.emailLabel') }}
          </label>
          <input 
            id="forgot-email" 
            type="email" 
            autocomplete="email" 
          />
        </div>
        <button class="auth-submit" type="button">
          {{ language.t('auth.sendResetLink') }}
        </button>
        <p class="auth-switch">
          {{ language.t('auth.rememberPassword') }}
          <a class="auth-link" routerLink="/login">
            {{ language.t('auth.signIn') }}
          </a>
        </p>
      </form>
    </app-auth-card>
  </main>
</app-page-shell>
