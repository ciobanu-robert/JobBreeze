<app-page-shell>
  <main class="auth-main">
    <app-auth-card>
      <h1 class="auth-title">{{ language.t('auth.login.title') }}</h1>
      <p class="auth-subtitle">{{ language.t('auth.login.subtitle') }}</p>

      <form class="auth-form">
        <div class="auth-field">
          <label for="login-email">{{ language.t('auth.emailLabel') }}</label>
          <input id="login-email" type="email" autocomplete="email" />
        </div>

        <div class="auth-field">
          <label class="password-label" for="login-password">
            <span>{{ language.t('auth.passwordLabel') }}</span>
            <a class="auth-link" routerLink="/forgot-password">{{
              language.t('auth.forgotPassword')
            }}</a>
          </label>
          <app-password-field
            fieldId="login-password"
            autocomplete="current-password"
          ></app-password-field>
        </div>

        <button class="auth-submit" type="button" (click)="signIn()">
          {{ language.t('auth.signIn') }}
        </button>
        <p class="auth-switch">
          {{ language.t('auth.noAccount') }}
          <a class="auth-link" routerLink="/register">{{ language.t('auth.signUp') }}</a>
        </p>
        <app-social-login-buttons></app-social-login-buttons>
      </form>
    </app-auth-card>
  </main>
</app-page-shell>
