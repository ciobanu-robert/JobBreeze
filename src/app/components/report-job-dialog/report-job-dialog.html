@if (open()) {
  <div
    class="report-overlay"
    [class.dark-theme]="theme.isDarkTheme()"
    (click)="close()"
  >
    <div
      class="report-dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="report-title"
      (click)="$event.stopPropagation()"
    >
      <button
        class="close-button"
        type="button"
        [attr.aria-label]="language.t('report.closeAria')"
        (click)="close()"
      >
        <img src="/assets/ui/x.svg" alt="" />
      </button>

      @if (sent()) {
        <div class="report-success">
          <h2 id="report-title">
            {{ language.t('report.successTitle') }}
          </h2>
          <p>
            {{ language.t('report.successText') }}
          </p>
          <button
            class="submit-button"
            type="button"
            (click)="close()"
          >
            {{ language.t('report.done') }}
          </button>
        </div>
      } @else {
        <h2 id="report-title">
          {{ language.t('report.title') }}
        </h2>

        @if (job(); as currentJob) {
          <p class="report-job">
            {{ currentJob.title }} ·
            {{ currentJob.company }}
          </p>
        }

        <div class="report-field">
          <label for="report-reason">
            {{ language.t('report.reasonLabel') }}
          </label>
          <div class="select-wrapper">
            <select
              id="report-reason"
              [value]="reason()"
              (change)="
                reason.set($any($event.target).value)
              "
            >
              <option value="" disabled>
                {{ language.t('report.reasonPlaceholder') }}
              </option>
              @for (
                option of reasonOptions;
                track option.value
              ) {
                <option [value]="option.value">
                  {{ language.t(option.labelKey) }}
                </option>
              }
            </select>
          </div>
        </div>

        <div class="report-field">
          <label for="report-details">
            {{ language.t('report.detailsLabel') }}
          </label>
          <textarea
            id="report-details"
            rows="4"
            [attr.maxlength]="detailsMaxLength"
            [placeholder]="
              language.t('report.detailsPlaceholder')
            "
            [value]="details()"
            (input)="details.set($any($event.target).value)"
          ></textarea>
          <span class="char-count">
            {{ details().length }} / {{ detailsMaxLength }}
          </span>
        </div>

        <button
          class="submit-button"
          type="button"
          [disabled]="!canSubmit()"
          (click)="submit()"
        >
          {{ language.t('report.submit') }}
        </button>
      }
    </div>
  </div>
}
