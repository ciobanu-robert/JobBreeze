<div
  class="job-stack"
  [class.dark-theme]="theme.isDarkTheme()"
  [attr.aria-label]="language.t('jobCard.ariaLabel')"
>
  <div class="job-card-back back-one"></div>
  <div class="job-card-back back-two"></div>

  <app-job-swipe-card
    class="job-card"
    [job]="previewJob()"
    [interactive]="false"
  >
    <div class="preview-actions" aria-hidden="true">
      <span class="action-button reject">
        <img src="/assets/ui/x.svg" alt="" />
      </span>
      <span class="action-button bookmark">
        <img src="/assets/jobs/bookmark.svg" alt="" />
      </span>
      <span class="action-button like">
        <img src="/assets/jobs/heart.svg" alt="" />
      </span>
    </div>
  </app-job-swipe-card>
</div>
