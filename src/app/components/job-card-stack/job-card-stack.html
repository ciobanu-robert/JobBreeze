<div class="job-stack" aria-label="Example job card">
    <div class="job-card-back back-one"></div>
    <div class="job-card-back back-two"></div>

    <article class="job-card">
        <div class="job-card-top">
            <div class="company-mark">J</div>
            <div>
                <h2>Product Designer</h2>
                <p>JobBreeze</p>
            </div>
        </div>
        <p class="job-description">
            Join a small team building tools people use every
            day. You will have room to do thoughtful work and
            make a visible difference.
        </p>
        <div class="job-tags">
            <span>Remote</span>
            <span>€60-80k</span>
            <span>Full-time</span>
        </div>
        <div class="job-controls">
            <button class="reject-button" type="button" aria-label="Skip job">
                <img src="/assets/ui/x.svg" alt="">
            </button>
            <button class="like-button" type="button" aria-label="Like job">
                <img src="/assets/jobs/heart.svg" alt="">
            </button>
        </div>
    </article>
</div>
