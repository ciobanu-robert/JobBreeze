<div class="password-field">
  <input
    [id]="fieldId()"
    [type]="visible() ? 'text' : 'password'"
    [autocomplete]="autocomplete()"
  />
  <button
    class="toggle-visibility"
    type="button"
    [attr.aria-label]="
      visible() ? language.t('auth.hidePassword') : language.t('auth.showPassword')
    "
    (click)="toggleVisibility()"
  >
    <img [src]="visible() ? '/assets/ui/eye-off.svg' : '/assets/ui/eye.svg'" alt="" />
  </button>
</div>
