<div class="section-header" [class.danger]="danger()">
  <span class="section-icon">
    <span
      class="icon"
      [style.--icon]="'url(' + icon() + ')'"
    >
    </span>
  </span>
  <div class="section-title">
    <h3>
      {{ language.t(titleKey()) }}
    </h3>
    @if (hintKey(); as hint) {
      <p class="section-hint">
        {{ language.t(hint) }}
      </p>
    }
  </div>

  @if (count() !== null) {
    <span class="section-count">
      {{ count() }}
    </span>
  }
  @if (addable()) {
    <button
      class="add-button"
      type="button"
      (click)="add.emit()"
    >
      <span
        class="icon"
        style="--icon: url(/assets/ui/plus.svg)"
      >
      </span>
      {{ language.t('profile.add') }}
    </button>
  }
</div>
