<app-page-shell [flushBottom]="true">
  <main class="legal-main">
    <a
      class="back-link"
      [class.dark-theme]="theme.isDarkTheme()"
      routerLink="/"
    >
      <img src="/assets/navigation/arrow-left.svg" alt="" />
      {{ language.t('legal.backHome') }}
    </a>

    <h1>{{ language.t(titleKey()) }}</h1>
    <p class="legal-intro">
      {{ language.t(introKey()) }}
    </p>

    <div class="legal-sections">
      @for (
        section of sections();
        track section.headingKey
      ) {
        <section class="legal-section">
          <h2>{{ language.t(section.headingKey) }}</h2>
          <p>{{ language.t(section.bodyKey) }}</p>
        </section>
      }
    </div>
  </main>

  <app-site-footer></app-site-footer>
</app-page-shell>
