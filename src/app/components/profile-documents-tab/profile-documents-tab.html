<input
  #fileInput
  type="file"
  accept=".pdf, .doc, .docx"
  hidden
  (change)="onFileSelected($event)"
/>

<section class="profile-section">
  <app-profile-section-header
    icon="/assets/ui/file-text.svg"
    titleKey="profile.cv"
  >
  </app-profile-section-header>

  @if (profile().cvFileName; as fileName) {
    <div class="cv-file">
      <span class="file-icon">
        <span
          class="icon"
          style="--icon: url(/assets/ui/file-text.svg)"
        >
        </span>
      </span>
      <div class="file-info">
        <p class="file-name">
          {{ fileName }}
        </p>
        <p class="file-hint">
          {{ language.t('profile.cvUploaded') }}
        </p>
      </div>
      <button
        class="ghost-button"
        type="button"
        (click)="fileInput.click()"
      >
        {{ language.t('profile.cvReplace') }}
      </button>
      <button
        class="icon-button danger"
        type="button"
        [attr.aria-label]="language.t('profile.delete')"
        (click)="removeCv()"
      >
        <span
          class="icon"
          style="--icon: url(/assets/ui/trash-2.svg)"
        >
        </span>
      </button>
    </div>
  } @else {
    <button
      class="drop-zone"
      type="button"
      [class.dragging]="dragging()"
      (click)="fileInput.click()"
      (dragover)="onDragOver($event)"
      (dragleave)="dragging.set(false)"
      (drop)="onDrop($event)"
    >
      <span class="drop-icon">
        <span
          class="icon"
          style="--icon: url(/assets/ui/upload.svg)"
        >
        </span>
      </span>
      <span class="drop-title">
        {{ language.t('profile.cvDropTitle') }}
      </span>
      <span class="drop-hint">
        {{ language.t('profile.cvDropHint') }}
      </span>
    </button>
  }

  @if (cvError(); as error) {
    <p class="cv-error">
      {{ language.t(error) }}
    </p>
  }
</section>

<section class="profile-section">
  <app-profile-section-header
    icon="/assets/ui/pencil.svg"
    titleKey="profile.coverLetter"
  >
  </app-profile-section-header>

  <label class="field">
    <span>
      {{ language.t('profile.coverLetterHint') }}
    </span>
    <textarea
      rows="10"
      [attr.maxlength]="coverLetterLimit"
      [value]="profile().coverLetter"
      (input)="setCoverLetter($event)"
    >
    </textarea>
  </label>
  <p class="char-count">
    {{ profile().coverLetter.length }} /
    {{ coverLetterLimit }}
  </p>
</section>
