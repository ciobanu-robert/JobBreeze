<section class="profile-section">
  <app-profile-section-header
    icon="/assets/ui/file-text.svg"
    titleKey="profile.cv"
  >
  </app-profile-section-header>

  <app-cv-upload
    [fileName]="profile().cvFileName"
    (selected)="changed.emit({ cvFileName: $event })"
    (removed)="changed.emit({ cvFileName: null })"
  >
  </app-cv-upload>
</section>

<section class="profile-section">
  <app-profile-section-header
    icon="/assets/ui/pencil.svg"
    titleKey="profile.coverLetter"
  >
  </app-profile-section-header>

  <label class="field">
    <span>
      {{ language.t('profile.coverLetterHint') }}
    </span>
    <textarea
      rows="10"
      [attr.maxlength]="coverLetterLimit"
      [value]="profile().coverLetter"
      (input)="setCoverLetter($event)"
    >
    </textarea>
  </label>
  <p class="char-count">
    {{ profile().coverLetter.length }} /
    {{ coverLetterLimit }}
  </p>
</section>
